[project]
name = "health-bridge-archive-fork"
version = "2.1.1a1"
requires-python = ">=3.14"

[project.optional-dependencies]
test = [
    "pytest-homeassistant-custom-component==0.13.366",
    "home-assistant-frontend==20260826.7",
    "ruff==0.16.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"custom_components/health_bridge/const.py" = ["F401"]
"custom_components/health_bridge/health-bridge-diagnostics.py" = ["F401", "F821"]
"custom_components/health_bridge/test_health_bridge.py" = ["F401", "F541"]
